# 新部署：docker compose -f compose.example.yaml up -d
# 既有部署請沿用原 Compose 檔及資料目錄，避免切換到新的空資料庫。
services:
  gptjsbot:
    image: ghcr.io/chikenscrach/gptjsbot:latest
    container_name: gptjsbot
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BOT_DATA_DIR: /app/data
    volumes:
      - ./data:/app/data
      # 自訂網址規則時，先建立 settings.json，再取消下列註解。
      # 未掛載時沿用內附預設。既有部署請保留上方原有的資料掛載。
      # - type: bind
      #   source: ./settings.json
      #   target: /app/settings.json
      #   read_only: true
      #   bind:
      #     create_host_path: false
